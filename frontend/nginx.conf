# Раздача собранной клиентской части без API - для запуска образа
# отдельно. На стендах этот файл заменяется конфигурацией среды
# из cicd/<среда>/nginx.conf.
# Версию Nginx в заголовке Server и на страницах ошибок не показываем.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
