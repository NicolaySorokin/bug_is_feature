<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="13">
  <title>Архитектура EDU CRM: контейнеры и потоки данных</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6a80"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- Пользователи -->
  <rect x="24" y="200" width="150" height="96" rx="12" fill="#f8f2ff" stroke="#7700ff" stroke-width="1.5"/>
  <text x="99" y="232" text-anchor="middle" font-weight="700">Браузер</text>
  <text x="99" y="252" text-anchor="middle" fill="#5f6a80">КАМ, руководитель,</text>
  <text x="99" y="270" text-anchor="middle" fill="#5f6a80">администратор</text>
  <!-- Сервер -->
  <rect x="220" y="24" width="516" height="472" rx="16" fill="#fcfbff" stroke="#c5cad6" stroke-dasharray="6 5"/>
  <text x="238" y="50" font-weight="700" fill="#3a4760">Сервер: Docker Compose</text>
  <!-- Nginx -->
  <rect x="250" y="190" width="170" height="116" rx="12" fill="#ffffff" stroke="#7700ff" stroke-width="2"/>
  <text x="335" y="218" text-anchor="middle" font-weight="700">nginx</text>
  <text x="335" y="238" text-anchor="middle" fill="#5f6a80">edu-crm-web</text>
  <text x="335" y="260" text-anchor="middle" fill="#5f6a80">клиентская часть React,</text>
  <text x="335" y="278" text-anchor="middle" fill="#5f6a80">TLS, прокси</text>
  <text x="335" y="296" text-anchor="middle" fill="#5f6a80">:80 / :443</text>
  <!-- API -->
  <rect x="480" y="70" width="220" height="110" rx="12" fill="#ffffff" stroke="#3a4760" stroke-width="1.5"/>
  <text x="590" y="98" text-anchor="middle" font-weight="700">api</text>
  <text x="590" y="118" text-anchor="middle" fill="#5f6a80">edu-crm-api: FastAPI, Python 3.12</text>
  <text x="590" y="138" text-anchor="middle" fill="#5f6a80">REST /api/v1, Swagger /docs</text>
  <text x="590" y="158" text-anchor="middle" fill="#5f6a80">том api_storage - файлы</text>
  <!-- Keycloak -->
  <rect x="480" y="210" width="220" height="90" rx="12" fill="#ffffff" stroke="#3a4760" stroke-width="1.5"/>
  <text x="590" y="238" text-anchor="middle" font-weight="700">keycloak</text>
  <text x="590" y="258" text-anchor="middle" fill="#5f6a80">Keycloak 26, реалм edu-crm</text>
  <text x="590" y="278" text-anchor="middle" fill="#5f6a80">OIDC, PKCE, роли</text>
  <!-- DB -->
  <rect x="480" y="340" width="220" height="90" rx="12" fill="#ffffff" stroke="#3a4760" stroke-width="1.5"/>
  <text x="590" y="370" text-anchor="middle" font-weight="700">db</text>
  <text x="590" y="390" text-anchor="middle" fill="#5f6a80">PostgreSQL 16</text>
  <text x="590" y="410" text-anchor="middle" fill="#5f6a80">том pgdata</text>
  <!-- Внешние -->
  <rect x="780" y="70" width="156" height="70" rx="12" fill="#fff6f2" stroke="#ff4f12" stroke-width="1.5"/>
  <text x="858" y="100" text-anchor="middle" font-weight="700">LMS ИТ Школы</text>
  <text x="858" y="120" text-anchor="middle" fill="#5f6a80">программы, обучающиеся</text>
  <rect x="780" y="160" width="156" height="70" rx="12" fill="#fff6f2" stroke="#ff4f12" stroke-width="1.5"/>
  <text x="858" y="190" text-anchor="middle" font-weight="700">Сайт ИТ Школы</text>
  <text x="858" y="210" text-anchor="middle" fill="#5f6a80">заявки на обучение</text>
  <rect x="780" y="340" width="156" height="90" rx="12" fill="#f6f6f8" stroke="#a2a9b8" stroke-width="1.5"/>
  <text x="858" y="370" text-anchor="middle" font-weight="700">Файлы Excel</text>
  <text x="858" y="390" text-anchor="middle" fill="#5f6a80">каталоги XLS/XLSX,</text>
  <text x="858" y="410" text-anchor="middle" fill="#5f6a80">отчёты XLSX/XLS/PDF</text>
  <!-- Связи -->
  <path d="M174,248 L250,248" stroke="#5f6a80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="212" y="238" text-anchor="middle" fill="#3a4760">HTTPS</text>
  <path d="M420,220 C450,200 450,140 480,130" stroke="#5f6a80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="452" y="160" text-anchor="middle" fill="#3a4760">/api</text>
  <path d="M420,255 L480,255" stroke="#5f6a80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="450" y="247" text-anchor="middle" fill="#3a4760">/realms</text>
  <path d="M590,180 L590,210" stroke="#5f6a80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="656" y="200" text-anchor="middle" fill="#3a4760">ключи, роли</text>
  <path d="M700,150 C720,160 720,330 700,360" stroke="#5f6a80" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="742" y="300" text-anchor="middle" fill="#3a4760">SQL</text>
  <path d="M700,110 L780,105" stroke="#ff4f12" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M700,140 C740,150 750,190 780,195" stroke="#ff4f12" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="740" y="92" text-anchor="middle" fill="#3a4760">JSON</text>
  <path d="M174,280 C300,470 700,470 780,395" stroke="#a2a9b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="300" y="455" text-anchor="middle" fill="#3a4760">загрузка и выгрузка через интерфейс</text>
</svg>
