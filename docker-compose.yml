# Базовый состав стенда, общий для всех сред. Ничего, специфичного для
# разработки, здесь нет: код не монтируется, порты наружу не публикуются.
# Отличия среды лежат в cicd/<среда>/docker-compose.yml и подключаются
# вторым файлом - это делает Makefile, см. переменную ENV.
#
#   make up             # то же, что ENV=dev
#   make up ENV=prod
#
# Напрямую, без make:
#   docker compose -f docker-compose.yml -f cicd/dev/docker-compose.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: edu_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edu_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_crm}
      POSTGRES_DB: ${POSTGRES_DB:-edu_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # На новом томе заводит базу Keycloak рядом с базой системы.
      - ./deploy/postgres/keycloak-db.sh:/docker-entrypoint-initdb.d/keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu_crm} -d ${POSTGRES_DB:-edu_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Имя образа общее для сред: его же запускает keycloak-setup.
    image: edu-crm-api:${API_IMAGE_TAG:-latest}
    container_name: edu_crm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AUTH_BACKEND: ${AUTH_BACKEND:-dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-edu_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_crm}
      POSTGRES_DB: ${POSTGRES_DB:-edu_crm}
      # Внешний адрес Keycloak попадает в токен и проверяется как издатель,
      # внутренний нужен API, чтобы забрать ключи реалма по сети контейнеров.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-edu-crm}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-edu-crm-api}
      # Контрактов LMS и сайта пока нет: по умолчанию адаптеры отдают
      # тестовые ответы из backend/app/services/integrations/fixtures.
      LMS_BASE_URL: ${LMS_BASE_URL:-}
      LMS_TOKEN: ${LMS_TOKEN:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      SITE_TOKEN: ${SITE_TOKEN:-}
      # Обмен по расписанию, раз в N часов; 0 - только вручную (значение по
      # умолчанию, администратор меняет его в «Настройках»).
      INTEGRATION_SYNC_INTERVAL_HOURS: ${INTEGRATION_SYNC_INTERVAL_HOURS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Сколько выгрузок (PDF, XLSX, диаграммы) один процесс API собирает
      # одновременно; остальные ждут в очереди, не задерживая интерфейс.
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-1}
    volumes:
      - api_storage:/app/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # Healthy означает, что миграции прошли и API отвечает: на это опирается `make up`.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Включается отдельно: make keycloak (в средах preprod и prod - всегда).
  # Образ - Keycloak с темой страницы входа (deploy/keycloak/image), данные -
  # в своей базе того же PostgreSQL. Реалм, клиенты, роли и пользователи
  # приезжают из realm-export.json: при первом запуске - импортом, дальше -
  # сервисом keycloak-setup.
  keycloak:
    build: ./deploy/keycloak/image
    image: edu-crm-keycloak:${KEYCLOAK_IMAGE_TAG:-latest}
    container_name: edu_crm_keycloak
    restart: unless-stopped
    profiles: ["keycloak"]
    depends_on:
      db:
        condition: service_healthy
    command: start --optimized --import-realm
    environment:
      # Администратор консоли Keycloak (реалм master). Заводится только
      # при первом запуске на пустой базе.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-edu_crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-edu_crm}
      # Внешний адрес: он попадает в токены и ссылки страниц входа.
      KC_HOSTNAME: ${KEYCLOAK_BASE_URL:-http://localhost:8080}
      # TLS снимает Nginx, сам Keycloak слушает HTTP внутри сети контейнеров.
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Разовая задача: переносит realm-export.json в работающий Keycloak
  # и ставит пароли пользователей из KEYCLOAK_USER_PASSWORDS. Запускается
  # после подъёма стенда (make up, release.sh):
  #   docker compose ... run --rm keycloak-setup
  # Подробности - backend/scripts/keycloak_setup.py.
  keycloak-setup:
    image: edu-crm-api:${API_IMAGE_TAG:-latest}
    profiles: ["setup"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-edu-crm}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_USER_PASSWORDS: ${KEYCLOAK_USER_PASSWORDS:-}
      KEYCLOAK_SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-}
      # Адреса веб-интерфейса среды - они же адреса возврата после входа.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./deploy/keycloak/realm-export.json:/realm/realm-export.json:ro
    command: python -m scripts.keycloak_setup

  # Единая точка входа: клиентская часть и прокси к API (и Keycloak -
  # в preprod и prod). Образ собирается из frontend/: Node собирает
  # статику, Nginx её раздаёт. Конфигурацию Nginx задаёт среда:
  # cicd/<среда>/nginx.conf.
  nginx:
    build: ./frontend
    image: edu-crm-web:${WEB_IMAGE_TAG:-latest}
    container_name: edu_crm_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_storage:
