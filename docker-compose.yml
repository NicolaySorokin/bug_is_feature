# Базовый состав стенда, общий для всех сред. Ничего, специфичного для
# разработки, здесь нет: код не монтируется, порты наружу не публикуются.
# Отличия среды лежат в cicd/<среда>/docker-compose.yml и подключаются
# вторым файлом - это делает Makefile, см. переменную ENV.
#
#   make up             # то же, что ENV=dev
#   make up ENV=prod
#
# Напрямую, без make:
#   docker compose -f docker-compose.yml -f cicd/dev/docker-compose.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: edu_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edu_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_crm}
      POSTGRES_DB: ${POSTGRES_DB:-edu_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu_crm} -d ${POSTGRES_DB:-edu_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: edu_crm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AUTH_BACKEND: ${AUTH_BACKEND:-dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-edu_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_crm}
      POSTGRES_DB: ${POSTGRES_DB:-edu_crm}
      # Внешний адрес Keycloak попадает в токен и проверяется как издатель,
      # внутренний нужен API, чтобы забрать ключи реалма по сети контейнеров.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-edu-crm}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-edu-crm-api}
      # Контрактов LMS и сайта пока нет: по умолчанию адаптеры отдают
      # тестовые ответы из backend/app/services/integrations/fixtures.
      LMS_BASE_URL: ${LMS_BASE_URL:-}
      LMS_TOKEN: ${LMS_TOKEN:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      SITE_TOKEN: ${SITE_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - api_storage:/app/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # Healthy означает, что миграции прошли и API отвечает: на это опирается `make up`.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Включается отдельно: make keycloak (в средах preprod и prod - всегда).
  # Реалм, клиенты, роли и тестовые пользователи приезжают из realm-export.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: edu_crm_keycloak
    restart: unless-stopped
    profiles: ["keycloak"]
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_BASE_URL:-http://localhost:8080}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  # Единая точка входа: клиентская часть и прокси к API (и Keycloak -
  # в preprod и prod). Образ собирается из frontend/: Node собирает
  # статику, Nginx её раздаёт. Конфигурацию Nginx задаёт среда:
  # cicd/<среда>/nginx.conf.
  nginx:
    build: ./frontend
    image: edu-crm-web:${WEB_IMAGE_TAG:-latest}
    container_name: edu_crm_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_storage:
