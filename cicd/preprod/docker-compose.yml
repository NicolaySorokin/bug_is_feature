# Предпродуктивная среда: как на бою, но по HTTP. Секреты в cicd/preprod/.env,
# запуск: make up ENV=preprod

services:
  db:
    ports:
      # Только с машины, где поднят стенд: наружу порт не уходит.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    environment:
      ENVIRONMENT: prod
      AUTH_BACKEND: keycloak
    # Порт наружу не публикуется: запросы приходят через Nginx.
    expose:
      - "8000"

  keycloak:
    expose:
      - "8080"
    environment:
      KC_PROXY_HEADERS: xforwarded

  keycloak-setup:
    environment:
      ENVIRONMENT: prod

  # Образ с клиентской частью (edu-crm-web) описан в docker-compose.yml.
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./cicd/preprod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
