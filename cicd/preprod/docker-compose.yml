# Предпродуктивная среда: то же, что на бою, но по HTTP и с доступом
# к PostgreSQL снаружи для разбора данных. Наружу смотрит только Nginx.
#
# Обязательно задайте секреты в cicd/preprod/.env (см. .env.example)
# и запускайте с ним:  make up ENV=preprod

services:
  db:
    ports:
      # Только с машины, где поднят стенд: наружу порт не уходит.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    environment:
      ENVIRONMENT: prod
      AUTH_BACKEND: keycloak
    # Порт наружу не публикуется: запросы приходят через Nginx.
    expose:
      - "8000"

  keycloak:
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: edu_crm_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./cicd/preprod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
