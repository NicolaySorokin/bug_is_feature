# Единая точка входа: наружу торчит только Nginx, PostgreSQL и Keycloak
# напрямую в интернет не публикуются (раздел 10.2.3 концепции).

upstream api {
    server api:8000;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name _;

    # Перенаправления остаются относительными: стенд бывает доступен
    # не только по порту 80, и подставлять его в адрес не нужно.
    absolute_redirect off;

    # Выгрузки отчётов и загрузка каталогов бывают крупными.
    client_max_body_size 32m;
    # Построение отчёта за большой период занимает время.
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    # Keycloak отдаёт страницу входа и ключи реалма по этим путям.
    location /realms/ {
        proxy_pass http://keycloak;
    }

    location /resources/ {
        proxy_pass http://keycloak;
    }

    # Клиентская часть появится здесь: пока корень ведёт на документацию API.
    location / {
        return 302 /docs;
    }
}
