# Единая точка входа: клиентская часть и прокси к API и Keycloak. PostgreSQL
# и Keycloak напрямую наружу не публикуются.

# Версию Nginx в заголовке Server и на страницах ошибок не показываем.
server_tokens off;

upstream api {
    server api:8000;
}

upstream keycloak {
    server keycloak:8080;
}

# Файлы сборки с хешем в имени кэшируются на год, index.html проверяется при
# каждом открытии. API и Keycloak управляют кэшем сами.
map $uri $static_cache {
    ~^/assets/                                   "public, max-age=31536000, immutable";
    ~^/(api|docs|redoc|realms|resources)(/|$)    "";
    default                                      "no-cache";
}

# Политика безопасности содержимого для клиентской части. Keycloak и Swagger UI
# задают свою сами.
map $uri $page_csp {
    ~^/(api|docs|redoc|realms|resources)(/|$)    "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;

    # Перенаправления остаются относительными: стенд бывает доступен
    # не только по порту 80, и подставлять его в адрес не нужно.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $page_csp always;
    add_header Cache-Control $static_cache always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Выгрузки отчётов и загрузка каталогов бывают крупными.
    client_max_body_size 32m;
    # Построение отчёта за большой период занимает время.
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    # Keycloak: снаружи открыт только реалм системы и статика его страниц.
    location /realms/edu-crm/ {
        proxy_pass http://keycloak;
    }

    location /realms/ {
        return 404;
    }

    location /resources/ {
        proxy_pass http://keycloak;
    }

    # Клиентская часть: адреса страниц разбирает само приложение.
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
