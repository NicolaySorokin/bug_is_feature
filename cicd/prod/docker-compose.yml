# Продуктивная среда: HTTPS, наружу только Nginx, лимиты ресурсов, перезапуск
# при падении. На сервере стенд разворачивает deploy.yml. Под нагрузкой из ТЗ
# занято около 1,4 ГБ из 4 ГБ, лимиты ниже нужны на случай утечки.

# Имя проекта не зависит от каталога: на сервере каждый релиз лежит
# в своей папке, а контейнеры и тома должны оставаться теми же.
name: edu-crm

services:
  db:
    # Наружу и на хост порт не публикуется совсем: только сеть контейнеров.
    mem_limit: 1g
    restart: always

  api:
    # Образ собирается в CI и привозится готовым, тег равен коммиту. Без API_IMAGE_TAG
    # собирается как обычно.
    image: edu-crm-api:${API_IMAGE_TAG:-latest}
    environment:
      ENVIRONMENT: prod
      AUTH_BACKEND: keycloak
      # Число процессов под нагрузку из ТЗ: 50 пользователей и 10 отчётов сразу.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    expose:
      - "8000"
    mem_limit: 1g
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers ${WEB_CONCURRENCY:-4} --proxy-headers
             --forwarded-allow-ips '*'"

  keycloak:
    # Образ собирается в CI, тег считается по содержимому deploy/keycloak/image,
    # поэтому без изменений темы контейнер не пересоздаётся.
    image: edu-crm-keycloak:${KEYCLOAK_IMAGE_TAG:-latest}
    expose:
      - "8080"
    restart: always
    # Без лимита JVM берёт кучу от памяти всего сервера (70%).
    mem_limit: 1g
    environment:
      # Запросы приходят через Nginx: схему и адрес клиента Keycloak берёт
      # из заголовков X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded

  keycloak-setup:
    environment:
      # На бою пароли пользователей только из секрета PROD_ENV.
      ENVIRONMENT: prod
    mem_limit: 256m

  # Nginx с клиентской частью: образ собирается в CI, тег равен коммиту.
  nginx:
    image: edu-crm-web:${WEB_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    labels:
      # Конфигурация подключена файлом: при её изменении контейнер
      # нужно пересоздать, иначе Nginx продолжит читать старую.
      edu-crm.nginx-conf-sha: ${NGINX_CONF_SHA:-}
    volumes:
      - ./cicd/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты Let's Encrypt с хоста. Выпускает и продлевает их certbot на хосте.
      - ${CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
