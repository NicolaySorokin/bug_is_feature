# Продуктивная среда: HTTPS, ничего лишнего наружу, ограничения ресурсов
# и перезапуск при падении. Сертификаты выпускаются certbot на хосте
# и подключаются каталогом.
#
# Обязательно задайте секреты в cicd/prod/.env (см. .env.example)
# и запускайте с ним:  make up ENV=prod
#
# На сервере стенд разворачивает workflow deploy.yml, см. cicd/README.md.
# Сервер - 4 ГБ. Под нагрузкой из ТЗ (make loadtest: 50 пользователей
# и 10 отчётов) занято около 1,4 ГБ: API с 4 процессами ~550 МБ, Keycloak
# ~560 МБ, PostgreSQL ~220 МБ. Лимиты ниже - потолок на случай утечки.
# Keycloak хранит данные в своей базе того же PostgreSQL (keycloak).

# Имя проекта не зависит от каталога: на сервере каждый релиз лежит
# в своей папке, а контейнеры и тома должны оставаться теми же.
name: edu-crm

services:
  db:
    # Наружу и на хост порт не публикуется совсем: только сеть контейнеров.
    mem_limit: 1g
    restart: always

  api:
    # Образ собирается в CI и привозится на сервер готовым, тег - коммит.
    # Без API_IMAGE_TAG (make up ENV=prod на своей машине) собирается как обычно.
    image: edu-crm-api:${API_IMAGE_TAG:-latest}
    environment:
      ENVIRONMENT: prod
      AUTH_BACKEND: keycloak
      # Число рабочих процессов под нагрузку из нефункциональных требований
      # (50 параллельных пользователей, 10 отчётов одновременно).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    expose:
      - "8000"
    mem_limit: 1g
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers ${WEB_CONCURRENCY:-4} --proxy-headers
             --forwarded-allow-ips '*'"

  keycloak:
    # Образ собирается в CI и привозится на сервер готовым. Тег - по
    # содержимому deploy/keycloak/image: пока тема и Dockerfile не менялись,
    # образ и контейнер остаются прежними.
    image: edu-crm-keycloak:${KEYCLOAK_IMAGE_TAG:-latest}
    expose:
      - "8080"
    restart: always
    # Без лимита JVM берёт кучу от памяти всего сервера (70%).
    mem_limit: 1g
    environment:
      # Запросы приходят через Nginx: схему и адрес клиента Keycloak берёт
      # из заголовков X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded

  keycloak-setup:
    environment:
      # Боевая среда: пароли пользователей - только из секрета PROD_ENV,
      # без пароля настройка реалма завершается ошибкой.
      ENVIRONMENT: prod
    mem_limit: 256m

  # Nginx с клиентской частью: образ edu-crm-web собирается в CI и
  # привозится на сервер готовым, тег - коммит (как у API).
  nginx:
    image: edu-crm-web:${WEB_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    labels:
      # Конфигурация подключена файлом: при её изменении контейнер
      # нужно пересоздать, иначе Nginx продолжит читать старую.
      edu-crm.nginx-conf-sha: ${NGINX_CONF_SHA:-}
    volumes:
      - ./cicd/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты Let's Encrypt с хоста. Выпуск и продление - certbot
      # на хосте, проверочные файлы он кладёт в CERTBOT_WEBROOT.
      - ${CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
