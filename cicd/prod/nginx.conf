# Боевая конфигурация: HTTP только для выпуска сертификата и редиректа,
# всё остальное - по HTTPS. Домен стенда задаётся при развёртывании,
# здесь он вынесен в server_name и пути к сертификатам.
#
# Nginx - единая точка входа: отдаёт клиентскую часть (статика из образа
# edu-crm-web), проксирует API и Keycloak. PostgreSQL, API и Keycloak
# наружу не публикуются.

# Версию Nginx в заголовке Server и на страницах ошибок не показываем.
server_tokens off;

upstream api {
    server api:8000;
}

upstream keycloak {
    server keycloak:8080;
}

# Кэширование статики: файлы сборки с хешем в имени не меняются - кэш
# на год; index.html проверяется при каждом открытии, чтобы после
# деплоя браузер сразу получал новую версию. Ответы API и Keycloak
# кэшем управляют сами (пустое значение - заголовок не добавляется).
map $uri $static_cache {
    ~^/assets/                                   "public, max-age=31536000, immutable";
    ~^/(api|docs|redoc|realms|resources)(/|$)    "";
    default                                      "no-cache";
}

# Политика безопасности содержимого - для клиентской части. Страницы
# Keycloak и Swagger UI задают свою политику сами.
map $uri $page_csp {
    ~^/(api|docs|redoc|realms|resources)(/|$)    "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name edu-crm.nikitarodionov.ru;

    # Проверка владения доменом для Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edu-crm.nikitarodionov.ru;

    ssl_certificate /etc/letsencrypt/live/edu-crm.nikitarodionov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edu-crm.nikitarodionov.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Требования к защите информации: браузер не должен ходить по HTTP,
    # страницу нельзя встроить во фрейм, тип содержимого не угадывается.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $page_csp always;
    add_header Cache-Control $static_cache always;

    # Сжатие текстовых ответов: страница и отчёты открываются быстрее.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Выгрузки отчётов и загрузка каталогов бывают крупными.
    client_max_body_size 32m;
    # Построение отчёта за большой период занимает время.
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    # Keycloak: наружу открыт только реалм системы (страница входа, токены,
    # ключи) и статика его страниц. Реалм master, консоль администратора
    # и служебные адреса Keycloak снаружи недоступны.
    location /realms/edu-crm/ {
        proxy_pass http://keycloak;
    }

    location /realms/ {
        return 404;
    }

    location /resources/ {
        proxy_pass http://keycloak;
    }

    # Клиентская часть: адреса страниц разбирает само приложение, поэтому
    # на любой путь, которого нет среди файлов, отдаётся index.html.
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
