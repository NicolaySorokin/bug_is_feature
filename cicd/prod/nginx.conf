# Боевая конфигурация: HTTP только для выпуска сертификата и редиректа,
# всё остальное - по HTTPS. Домен стенда задаётся при развёртывании,
# здесь он вынесен в server_name и пути к сертификатам.

upstream api {
    server api:8000;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name edu-crm.nikitarodionov.ru;

    # Проверка владения доменом для Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edu-crm.nikitarodionov.ru;

    ssl_certificate /etc/letsencrypt/live/edu-crm.nikitarodionov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edu-crm.nikitarodionov.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Требования к защите информации: браузер не должен ходить по HTTP,
    # страницу нельзя встроить во фрейм, тип содержимого не угадывается.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    location /realms/ {
        proxy_pass http://keycloak;
    }

    location /resources/ {
        proxy_pass http://keycloak;
    }

    # Сюда встанет клиентская часть; пока корень ведёт на документацию API.
    location / {
        return 302 /docs;
    }
}
