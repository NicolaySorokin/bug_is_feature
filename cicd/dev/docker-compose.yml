# Среда разработки: код монтируется, сервер перезапускается сам, порты открыты.
# Система целиком на http://localhost:3000. Пути считаются от корня проекта.

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    environment:
      ENVIRONMENT: dev
      AUTH_BACKEND: ${AUTH_BACKEND:-dev}
      DB_ECHO: ${DB_ECHO:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Режим разработки Keycloak: тема страницы входа не кэшируется.
  keycloak:
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak/image/themes/edu-crm:/opt/keycloak/themes/edu-crm:ro

  nginx:
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./cicd/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
