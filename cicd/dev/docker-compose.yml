# Среда разработки: код монтируется в контейнер, сервер перезапускается
# при изменении файлов, порты API, PostgreSQL и Keycloak открыты наружу.
# Система целиком (интерфейс и API) - http://localhost:3000.
#
# Относительные пути считаются от каталога первого compose-файла, то есть
# от корня проекта, а не от этой папки.

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    environment:
      ENVIRONMENT: dev
      AUTH_BACKEND: ${AUTH_BACKEND:-dev}
      DB_ECHO: ${DB_ECHO:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Режим разработки Keycloak: тема страницы входа не кэшируется, правки
  # в deploy/keycloak/image/themes видны после перезапуска контейнера.
  keycloak:
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak/image/themes/edu-crm:/opt/keycloak/themes/edu-crm:ro

  nginx:
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./cicd/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
