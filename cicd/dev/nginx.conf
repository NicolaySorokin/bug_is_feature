# Среда разработки: клиентская часть и прокси к API на http://localhost:3000.
# Для правки интерфейса удобнее npm run dev в frontend (http://localhost:5173).

# Версию Nginx в заголовке Server и на страницах ошибок не показываем.
server_tokens off;

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 32m;
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
