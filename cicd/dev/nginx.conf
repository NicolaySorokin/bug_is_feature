# Среда разработки: собранная клиентская часть и прокси к API на одном
# адресе (http://localhost:3000). Keycloak в разработке необязателен и
# открыт на своём порту, поэтому здесь не проксируется.
#
# Для правки интерфейса удобнее сервер Vite с горячей перезагрузкой:
# cd frontend && npm run dev (http://localhost:5173, API проксирует он же).

# Версию Nginx в заголовке Server и на страницах ошибок не показываем.
server_tokens off;

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 32m;
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location /redoc {
        proxy_pass http://api;
    }

    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
