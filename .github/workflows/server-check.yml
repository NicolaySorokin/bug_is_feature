name: Проверка сервера

# Доступ до боевого сервера по SSH и его состояние: кто мы, что за машина,
# сколько свободно памяти и диска. Ничего на сервере не меняет.
on:
  workflow_dispatch:
  push:
    branches: [feature/demo-test-data]

permissions:
  contents: read

concurrency:
  group: prod-server
  cancel-in-progress: false

jobs:
  check:
    name: SSH и ресурсы
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Состояние сервера
        run: |
          set -euo pipefail
          ssh prod 'bash -s' > report.txt <<'SH'
          set -u
          . /etc/os-release
          echo "Пользователь: $(whoami) ($(id -nG))"
          echo "Хост:         $(hostname)"
          echo "ОС:           $PRETTY_NAME, ядро $(uname -r), $(uname -m)"
          echo "Процессоры:   $(nproc)"
          echo "Аптайм:       $(uptime -p)"
          echo
          free -h
          echo
          df -h / | sed 1d | awk '{print "Диск /:       всего " $2 ", занято " $3 ", свободно " $4 " (" $5 ")"}'
          echo
          if command -v docker > /dev/null; then
            echo "Docker:       $(docker --version)"
            echo "Compose:      $(docker compose version 2>/dev/null || echo 'нет')"
            docker ps --format 'table {{.Names}}\t{{.Status}}' 2>/dev/null || sudo -n docker ps --format 'table {{.Names}}\t{{.Status}}'
          else
            echo "Docker:       не установлен"
          fi
          if command -v certbot > /dev/null; then
            echo "certbot:      $(certbot --version 2>&1)"
          else
            echo "certbot:      не установлен"
          fi
          SH
          cat report.txt
          {
            echo "## ✅ Сервер доступен по SSH"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
