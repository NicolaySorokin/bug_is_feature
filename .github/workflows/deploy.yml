name: Деплой

# Боевой стенд https://edu-crm.nikitarodionov.ru обновляется сам после
# зелёного CI на main: пуш или слияние pull request. Вручную
# (Actions → Деплой → Run workflow) можно выложить ветку или коммит -
# так же откатываются на старую версию - и при необходимости вернуть
# стенд к чистым демоданным. Как это устроено - cicd/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Коммит, тег или ветка. Пусто - ветка, выбранная выше
        required: false
        default: ""
      reset_data:
        description: >-
          Данные стенда. «Сбросить» - снять копию, удалить базу и файлы
          и загрузить чистые демоданные; необратимо для текущих данных
        type: choice
        options:
          - Оставить
          - Сбросить к демоданным
        default: Оставить

permissions:
  contents: read

# Один деплой за раз; очередной ждёт, а не отменяет идущий.
concurrency:
  group: prod-server
  cancel-in-progress: false

env:
  DOMAIN: edu-crm.nikitarodionov.ru
  LE_EMAIL: sorokin.n.04@mail.ru
  APP_DIR: /opt/edu-crm

jobs:
  deploy:
    name: Выкладка на prod
    # После CI - только если он прошёл и запускался пушем в main, а не PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Ровно тот коммит, который проверил CI.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Что выкладываем
        run: |
          sha=$(git rev-parse HEAD)
          tag=${sha:0:12}
          {
            echo "SHA=$sha"
            echo "TAG=$tag"
            echo "RELEASE=$(date -u +%Y%m%d-%H%M%S)-$tag"
            # Образ Keycloak помечается по содержимому deploy/keycloak/image,
            # тем же способом, что на сервере.
            echo "KEYCLOAK_TAG=$(bash cicd/prod/server/release.sh keycloak-tag .)"
          } >> "$GITHUB_ENV"
          git log -1 --format='%h %s (%an)'

      - name: Сборка образов
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$SHA" -t "edu-crm-api:$TAG" ./backend
          # Nginx с собранной клиентской частью: интерфейс и прокси к API.
          docker build --label "org.opencontainers.image.revision=$SHA" -t "edu-crm-web:$TAG" ./frontend

      - name: Проверка PROD_ENV
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          # Пароли пользователей реалма можно держать отдельным секретом:
          # его проще заменить, не переписывая PROD_ENV целиком.
          KEYCLOAK_USER_PASSWORDS: ${{ secrets.KEYCLOAK_USER_PASSWORDS }}
        run: |
          set -euo pipefail
          # Секрет вставлен из Windows: убираем \r, иначе он окажется в паролях.
          printf '%s\n' "$PROD_ENV" | tr -d '\r' > "$RUNNER_TEMP/prod.env"
          if [ -n "$KEYCLOAK_USER_PASSWORDS" ]; then
            # Одной строкой: пары через запятую, переводы строк и пробелы убираем.
            passwords=$(printf '%s' "$KEYCLOAK_USER_PASSWORDS" | tr -d '\r' | tr -s ' \n\t' ',' | sed 's/^,*//; s/,*$//')
            passwords=${passwords#KEYCLOAK_USER_PASSWORDS=}
            printf 'KEYCLOAK_USER_PASSWORDS=%s\n' "$passwords" >> "$RUNNER_TEMP/prod.env"
          fi
          value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/prod.env" | tail -1 | tr -d "\"'"; }

          keys=$(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$RUNNER_TEMP/prod.env" | sort -u | tr '\n' ' ')
          [ -n "$keys" ] || { echo "::error::Секрет PROD_ENV пуст или не в формате КЛЮЧ=значение"; exit 1; }
          echo "Переменные в PROD_ENV: $keys"

          # Без паролей compose подставил бы значения по умолчанию для разработки.
          for key in POSTGRES_PASSWORD KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_USER_PASSWORDS; do
            if [ -z "$(value "$key")" ]; then
              where="В PROD_ENV"
              [ "$key" != KEYCLOAK_USER_PASSWORDS ] || where="Ни в PROD_ENV, ни отдельным секретом"
              echo "::error::$where не задан $key"
              exit 1
            fi
          done

          # Пароль нужен каждому пользователю реалма, иначе под ним не войти.
          # Сравниваются только логины, сами пароли в журнал не попадают.
          users=$(jq -r '.users[].username' deploy/keycloak/realm-export.json | sort)
          given=$(value KEYCLOAK_USER_PASSWORDS | tr ', ' '\n\n' | sed -n 's/^\([^:]\{1,\}\):.\{1,\}$/\1/p' | sort -u)
          missing=$(comm -23 <(echo "$users") <(echo "$given") | tr '\n' ' ')
          if [ -n "$missing" ]; then
            echo "::error::В KEYCLOAK_USER_PASSWORDS нет паролей для: $missing"
            exit 1
          fi
          echo "Пароли заданы для всех $(echo "$users" | wc -l) пользователей реалма"
          if [ "$(value KEYCLOAK_BASE_URL)" != "https://$DOMAIN" ]; then
            echo "::warning::KEYCLOAK_BASE_URL в PROD_ENV не https://$DOMAIN - токены Keycloak не пройдут проверку издателя"
          fi

      - uses: ./.github/actions/ssh-setup
        id: ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Подготовка сервера
        run: |
          ssh prod "sudo env DEPLOY_USER=\$(id -un) APP_DIR=$APP_DIR bash -s" < cicd/prod/server/bootstrap.sh
          # Группа docker действует с нового входа: закрываем общее соединение.
          ssh -O exit prod 2> /dev/null || true

      - name: Код релиза
        env:
          REF_NAME: ${{ github.event.workflow_run.head_branch || inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          dir="$APP_DIR/releases/$RELEASE"
          ssh prod "mkdir -p $dir"
          git archive --format=tar HEAD | ssh prod "tar -xf - -C $dir"
          printf 'commit=%s\nref=%s\nrun=%s\nbuilt_at=%s\n' \
            "$SHA" "$REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(date -u +%FT%TZ)" | ssh prod "cat > $dir/REVISION"
          echo "Код выложен в $dir"

      # Образы едут с раннера: сервер не собирает и не ходит в реестры.
      # Уже привезённые повторно не передаются.
      - name: Образы на сервер
        run: |
          set -euo pipefail
          external=$(docker compose -f docker-compose.yml -f cicd/prod/docker-compose.yml \
            --profile keycloak config --images | grep -Ev '^edu-crm-' | sort -u)
          for image in $external "edu-crm-api:$TAG" "edu-crm-web:$TAG" "edu-crm-keycloak:$KEYCLOAK_TAG"; do
            if ssh prod docker image inspect "$image" > /dev/null 2>&1; then
              echo "$image: уже на сервере"
              continue
            fi
            # Keycloak собирается, только если такого образа на сервере ещё нет.
            if [[ $image == edu-crm-keycloak:* ]]; then
              docker build --label "org.opencontainers.image.revision=$SHA" -t "$image" ./deploy/keycloak/image
            fi
            [[ $image == edu-crm-* ]] || docker pull -q "$image"
            echo "$image: передаю"
            docker save "$image" | gzip -1 | ssh prod 'gunzip | docker load'
          done

      - name: Секреты среды
        run: ssh prod "umask 077 && cat > $APP_DIR/shared/prod.env.new && mv -f $APP_DIR/shared/prod.env.new $APP_DIR/shared/prod.env" < "$RUNNER_TEMP/prod.env"

      # Первый сертификат - до запуска Nginx, certbot --standalone на 80-м
      # порту. Если сертификат уже есть, шаг ничего не делает.
      - name: Сертификат
        run: ssh prod "sudo env DOMAIN=$DOMAIN LE_EMAIL=$LE_EMAIL bash $APP_DIR/releases/$RELEASE/cicd/prod/server/certificate.sh issue"

      # Не поднялся (healthcheck API не прошёл) - release.sh сам вернёт
      # прежний релиз, а шаг упадёт.
      - name: Запуск
        id: activate
        run: ssh prod "APP_DIR=$APP_DIR bash $APP_DIR/releases/$RELEASE/cicd/prod/server/release.sh activate $RELEASE"

      # Только при ручном запуске с «Сбросить к демоданным»: копия данных
      # в /opt/edu-crm/backups, удаление томов, запуск с чистыми демоданными.
      - name: Сброс данных к демоданным
        if: github.event_name == 'workflow_dispatch' && inputs.reset_data == 'Сбросить к демоданным'
        run: ssh prod "APP_DIR=$APP_DIR bash $APP_DIR/current/cicd/prod/server/release.sh reset-data --confirm"

      # Продление идёт через webroot, пока стенд работает. Перевод делается
      # один раз, с пробным продлением на тестовом сервере Let's Encrypt.
      - name: Продление сертификата через webroot
        run: ssh prod "sudo env DOMAIN=$DOMAIN bash $APP_DIR/current/cicd/prod/server/certificate.sh webroot"

      - name: Проверка стенда
        run: |
          set +e
          checks="$RUNNER_TEMP/checks.md"
          : > "$checks"
          failed=0
          ok() { echo "| $1 | ✅ $2 |" >> "$checks"; echo "OK: $1 - $2"; }
          fail() { echo "| $1 | ❌ $2 |" >> "$checks"; echo "::error::$1 - $2"; failed=1; }
          # Контейнеры только что пересозданы: даём им время ответить.
          retry() {
            local tries=$1 i
            shift
            for ((i = 1; i <= tries; i++)); do "$@" && return 0; sleep 5; done
            return 1
          }
          base="https://$DOMAIN"

          # curl проверяет сертификат: невалидный сертификат - это провал.
          health() {
            curl -fsS --max-time 10 -o "$RUNNER_TEMP/health.json" "$base/api/v1/health" \
              && grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
          }
          if retry 24 health; then
            ok "API здоров: /api/v1/health" "\`$(cat "$RUNNER_TEMP/health.json")\`"
          else
            fail "API здоров: /api/v1/health" "нет ответа status ok за 2 минуты"
          fi
          # Метод открыт без входа: ничего, кроме статуса, в нём быть не должно.
          if [ "$(tr -d ' \n' < "$RUNNER_TEMP/health.json")" = '{"status":"ok"}' ]; then
            ok "Служебные сведения скрыты" "/api/v1/health отдаёт только status"
          else
            fail "Служебные сведения скрыты" "/api/v1/health отдаёт лишнее"
          fi
          server=$(curl -sS --max-time 10 -o /dev/null -D - "$base/" | sed -n 's/^[Ss]erver: *//p' | tr -d '\r')
          if [[ $server != *[0-9]* ]]; then
            ok "Версия Nginx скрыта" "Server: $server"
          else
            fail "Версия Nginx скрыта" "Server: $server"
          fi

          read -r code url < <(curl -sS -L --max-time 20 -o "$RUNNER_TEMP/index.html" -w '%{http_code} %{url_effective}' "$base/")
          if [ "$code" = 200 ] && grep -q 'id="root"' "$RUNNER_TEMP/index.html"; then
            ok "Открывается система (не Swagger)" "200, $url - клиентская часть"
          else
            fail "Открывается система (не Swagger)" "код $code, $url - на / нет клиентской части"
          fi

          # Адрес страницы приложения открывается напрямую (закладка, ссылка из письма).
          code=$(curl -sS --max-time 10 -o "$RUNNER_TEMP/deep.html" -w '%{http_code}' "$base/contracts")
          if [ "$code" = 200 ] && grep -q 'id="root"' "$RUNNER_TEMP/deep.html"; then
            ok "Прямая ссылка на страницу" "/contracts → 200"
          else
            fail "Прямая ссылка на страницу" "/contracts → $code"
          fi

          asset=$(grep -o '/assets/[^"]*\.js' "$RUNNER_TEMP/index.html" | head -1)
          headers=$(curl -sS --max-time 10 -o /dev/null -D - "$base$asset")
          if grep -qi '^HTTP/[0-9.]* 200' <<< "$headers" && grep -qi 'cache-control:.*immutable' <<< "$headers"; then
            ok "Статика клиентской части" "$asset, кэш на год"
          else
            fail "Статика клиентской части" "$asset не отдаётся или без кэширования"
          fi

          if curl -sS --max-time 10 -o /dev/null -D - "$base/" | grep -qi '^content-security-policy:'; then
            ok "Заголовки безопасности" "Content-Security-Policy на месте"
          else
            fail "Заголовки безопасности" "нет Content-Security-Policy"
          fi

          read -r code url < <(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "http://$DOMAIN/")
          if [ "$code" = 301 ] && [ "$url" = "$base/" ]; then
            ok "HTTP ведёт на HTTPS" "301 → $url"
          else
            fail "HTTP ведёт на HTTPS" "код $code → $url"
          fi

          # Keycloak после пересоздания импортирует реалм, это до пары минут.
          oidc() { curl -fsS --max-time 10 -o /dev/null "$base/realms/edu-crm/.well-known/openid-configuration"; }
          if retry 36 oidc; then ok "Keycloak: реалм edu-crm" "200"; else fail "Keycloak: реалм edu-crm" "не отвечает за 3 минуты"; fi

          # Страница входа - в теме системы, а не стандартная Keycloak.
          # PKCE у клиента обязателен: без code_challenge страницы не будет.
          login="$base/realms/edu-crm/protocol/openid-connect/auth?client_id=edu-crm-web&response_type=code&scope=openid&code_challenge_method=S256&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&redirect_uri=$base/"
          if curl -fsS --max-time 10 "$login" | grep -q 'login/edu-crm/css/edu-crm.css'; then
            ok "Страница входа" "тема edu-crm"
          else
            fail "Страница входа" "не открывается или без темы edu-crm"
          fi

          # Вход только через страницу Keycloak: выдача токена по паролю
          # в обход неё (Direct Access Grants) у клиента выключена.
          grant=$(curl -sS --max-time 10 -X POST "$base/realms/edu-crm/protocol/openid-connect/token" \
            -d client_id=edu-crm-web -d grant_type=password -d username=deploy-check -d password=deploy-check)
          if grep -q unauthorized_client <<< "$grant"; then
            ok "Вход по паролю в обход страницы Keycloak" "запрещён"
          else
            fail "Вход по паролю в обход страницы Keycloak" "не запрещён: $grant"
          fi

          # Снаружи только реалм системы: master и консоль недоступны.
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$base/realms/master/.well-known/openid-configuration")
          if [ "$code" = 404 ]; then
            ok "Реалм master снаружи" "закрыт (404)"
          else
            fail "Реалм master снаружи" "код $code"
          fi

          cert=$(openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" < /dev/null 2> /dev/null \
            | openssl x509 -noout -enddate -issuer)
          until_date=$(sed -n 's/^notAfter=//p' <<< "$cert")
          issuer=$(sed -n 's/^issuer=.*CN *= *//p' <<< "$cert")
          if [ -n "$until_date" ]; then ok "Сертификат" "$issuer, действует до $until_date"; else fail "Сертификат" "не прочитан"; fi

          # Тот же путь, по которому certbot продлевает сертификат: файл
          # в webroot на хосте должен отдаваться Nginx по HTTP.
          token="deploy-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          acme=/var/www/certbot/.well-known/acme-challenge
          ssh prod "sudo install -d -m 755 $acme && echo $token | sudo tee $acme/$token > /dev/null"
          got=$(curl -sS --max-time 10 "http://$DOMAIN/.well-known/acme-challenge/$token")
          ssh prod "sudo rm -f $acme/$token"
          if [ "$got" = "$token" ]; then
            ok "Webroot для продления" "/.well-known/acme-challenge/ отдаётся"
          else
            fail "Webroot для продления" "файл из /var/www/certbot не отдаётся по HTTP"
          fi

          exit $failed

      - name: Память и диск сервера
        if: always() && steps.activate.outcome != 'skipped'
        run: |
          ssh prod "APP_DIR=$APP_DIR bash -s" > "$RUNNER_TEMP/server.txt" <<'SH'
          echo "== Память"
          free -h
          echo
          echo "== Контейнеры"
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
          echo
          echo "== Диск"
          df -h /
          echo
          echo "== Релизы (* - текущий)"
          bash "$APP_DIR/current/cicd/prod/server/release.sh" list
          SH
          cat "$RUNNER_TEMP/server.txt"
          # Запас памяти меньше 400 МБ - повод уменьшить WEB_CONCURRENCY в PROD_ENV.
          available=$(ssh prod "free -m | awk '/^Mem:/ {print \$7}'")
          if [ "$available" -lt 400 ]; then
            echo "::warning::На сервере свободно всего $available МБ памяти - уменьшите WEB_CONCURRENCY в PROD_ENV"
          fi

      - name: Логи стенда при сбое
        if: failure() && steps.ssh.outcome == 'success'
        run: ssh prod "APP_DIR=$APP_DIR bash $APP_DIR/current/cicd/prod/server/release.sh compose logs --no-color --tail 100" || true

      - name: Итог
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ github.event_name == 'workflow_run' && 'после CI на main' || format('вручную, {0}', github.actor) }}
        run: |
          subject=$(git log -1 --format=%s | sed 's/|/\\|/g')
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "## ✅ Стенд обновлён: https://$DOMAIN"
            else
              echo "## ❌ Деплой не удался"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Коммит | \`${SHA:0:12}\` $subject |"
            echo "| Релиз на сервере | \`${RELEASE:-}\` |"
            echo "| Запуск | $TRIGGER |"
            if [ -s "$RUNNER_TEMP/checks.md" ]; then
              echo
              echo "### Проверки после деплоя"
              echo
              echo "| Проверка | Результат |"
              echo "| --- | --- |"
              cat "$RUNNER_TEMP/checks.md"
            fi
            if [ -s "$RUNNER_TEMP/server.txt" ]; then
              echo
              echo "### Сервер"
              echo
              echo '```'
              cat "$RUNNER_TEMP/server.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
