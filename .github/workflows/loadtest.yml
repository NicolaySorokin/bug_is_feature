name: Нагрузочная проверка

# Нефункциональные требования ТЗ на боевом стенде: 50 одновременных
# пользователей и 10 параллельных отчётов, отклик интерфейса до 1 с.
# Запускается только вручную: Actions → «Нагрузочная проверка» → Run workflow.
# Нагрузка настоящая - не запускайте во время показа.
#
# Под Keycloak сотрудники входят по паролю через клиент edu-crm-loadtest.
# Он выключен и включается только на время замера; пароли берутся
# на сервере из секрета среды и в журнал не попадают.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Длительность замера, секунд
        default: "60"
      users:
        description: Одновременных пользователей
        default: "50"
      reports:
        description: Параллельных выгрузок отчётов
        default: "10"

permissions:
  contents: read

# Не одновременно с деплоем: оба работают с одним сервером.
concurrency:
  group: prod-server
  cancel-in-progress: false

env:
  APP_DIR: /opt/edu-crm

jobs:
  loadtest:
    name: Замер на prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Параметры
        env:
          DURATION: ${{ inputs.duration }}
          USERS: ${{ inputs.users }}
          REPORTS: ${{ inputs.reports }}
        run: |
          for value in "$DURATION" "$USERS" "$REPORTS"; do
            [[ $value =~ ^[0-9]{1,4}$ ]] || { echo "::error::Ожидается число, получено «$value»"; exit 1; }
          done
          echo "ARGS=--keycloak-url http://keycloak:8080 --duration $DURATION --users $USERS --reports $REPORTS" >> "$GITHUB_ENV"

      - name: Включить клиент нагрузки
        run: ssh prod "APP_DIR=$APP_DIR bash $APP_DIR/current/cicd/prod/server/release.sh keycloak-setup --loadtest on"

      - name: Замер
        run: |
          set -o pipefail
          # Пароли - из .env текущего релиза, только нужная переменная.
          ssh prod "cd $APP_DIR/current && \
            export KEYCLOAK_USER_PASSWORDS=\"\$(sed -n 's/^KEYCLOAK_USER_PASSWORDS=//p' cicd/prod/.env | tail -1)\" && \
            make --no-print-directory loadtest ENV=prod ARGS='$ARGS'" | tee "$RUNNER_TEMP/loadtest.txt"

      # Клиент выключается при любом исходе замера.
      - name: Выключить клиент нагрузки
        if: always()
        run: ssh prod "APP_DIR=$APP_DIR bash $APP_DIR/current/cicd/prod/server/release.sh keycloak-setup --loadtest off"

      - name: Итог
        if: always()
        run: |
          {
            echo "## Нагрузочная проверка: $ARGS"
            echo
            echo '```'
            grep -v '^docker compose' "$RUNNER_TEMP/loadtest.txt" 2> /dev/null || echo "Замер не выполнен"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
