name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edu_crm
          POSTGRES_PASSWORD: edu_crm
          POSTGRES_DB: edu_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: edu_crm
      POSTGRES_PASSWORD: edu_crm
      POSTGRES_DB: edu_crm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Проверка стиля
        run: ruff check .

      - name: Тесты
        run: pytest -q

      - name: Миграции
        run: alembic upgrade head

      - name: Модели и миграции не разошлись
        run: alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа backend
        run: docker build -t edu-crm-api:ci ./backend
