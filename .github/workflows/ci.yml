name: CI

# Результат виден галочкой у коммита и блоком Checks в pull request.
# Имя задания и есть имя проверки в списке.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Тесты и стиль
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edu_crm
          POSTGRES_PASSWORD: edu_crm
          POSTGRES_DB: edu_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: edu_crm
      POSTGRES_PASSWORD: edu_crm
      POSTGRES_DB: edu_crm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Шрифт с кириллицей для отчётов PDF, как в образе.
      - name: Шрифты
        run: sudo apt-get install --no-install-recommends -y fonts-dejavu-core

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Проверка стиля
        run: |
          ruff check .
          ruff format --check .

      - name: Тесты
        run: pytest -q --junitxml=junit.xml

      # Итог прогона видно прямо на странице проверки, без скачивания логов.
      - name: Итог тестов
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("junit.xml")
          if not report.is_file():
              print("## Тесты не запускались")
              raise SystemExit

          suite = ET.parse(report).getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          failed = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          mark = "✅" if failed == 0 else "❌"

          print(f"## {mark} Тесты: {total - failed - skipped} из {total}")
          print()
          print("| Показатель | Значение |")
          print("| --- | --- |")
          print(f"| Всего | {total} |")
          print(f"| Упало | {failed} |")
          print(f"| Пропущено | {skipped} |")
          print(f"| Время | {float(suite.get('time', 0)):.1f} с |")

          for case in suite.iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  print()
                  print(f"### {case.get('classname')}::{case.get('name')}")
                  print("```")
                  print((problem.get("message") or "").strip()[:800])
                  print("```")
          PY

      - name: Отчёт тестов файлом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: backend/junit.xml
          if-no-files-found: ignore

      - name: Миграции
        run: alembic upgrade head

      - name: Модели и миграции не разошлись
        run: alembic check

      # Демоданные нужны для демонстрации, поэтому ломаться они не должны.
      - name: Демонстрационные данные
        run: python -m scripts.seed

      # docs/openapi.json это контракт для клиентской
      # части, он не должен отставать от кода.
      - name: Схема API не отстала от кода
        run: |
          python -m scripts.openapi > /tmp/openapi.json
          if ! diff -q /tmp/openapi.json ../docs/openapi.json > /dev/null; then
            echo "::error::docs/openapi.json устарел - выполните make openapi и закоммитьте результат"
            diff -u ../docs/openapi.json /tmp/openapi.json | head -40
            exit 1
          fi

  frontend:
    name: Клиентская часть
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # Типы клиента генерируются из docs/openapi.json и не должны от него отставать.
      - name: Типы API не отстали от схемы
        run: |
          npm run api:types
          if ! git diff --quiet -- src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts устарел - выполните npm run api:types и закоммитьте результат"
            git diff --stat -- src/api/schema.d.ts
            exit 1
          fi

      - name: Проверка типов
        run: npm run typecheck

      - name: Проверка стиля
        run: |
          npm run lint -- --max-warnings=0
          npm run format:check

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа backend
        run: docker build -t edu-crm-api:ci ./backend

      - name: Сборка образа клиентской части (Nginx)
        run: docker build -t edu-crm-web:ci ./frontend

      # Keycloak с темой страницы входа и сборкой под PostgreSQL.
      - name: Сборка образа Keycloak
        run: docker build -t edu-crm-keycloak:ci ./deploy/keycloak/image

      - name: Проверка конфигураций сред
        run: |
          for env in dev preprod prod; do
            docker compose -f docker-compose.yml -f "cicd/$env/docker-compose.yml" \
              --profile keycloak --profile setup config --quiet
            echo "$env: конфигурация корректна"
          done

      # Скрипты сервера выполняются при каждом деплое,
      # ошибка в них всплыла бы только на стенде.
      - name: Скрипты сервера (shellcheck)
        run: shellcheck cicd/prod/server/*.sh deploy/postgres/*.sh deploy/keycloak/image/*.sh
